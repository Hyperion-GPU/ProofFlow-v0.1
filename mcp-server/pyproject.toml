[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofflow-mcp"
version = "0.1.0"
description = "MCP server for ProofFlow – local-first AI workflow audit dashboard"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
proofflow-mcp = "proofflow_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proofflow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
